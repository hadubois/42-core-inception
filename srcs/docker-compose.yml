version: '3.7'

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    restart: always
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    ports:
      - "3306:3306"
    networks:
      - inception
  nginx:
    container_name: nginx
    volumes:
      - wordpress:/var/www/html
    build: ./requirements/nginx
    restart: always
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    restart: always
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    depends_on:
      - mariadb

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: 'none'
      o: bind
      device: '/home/hadubois/data/wordpress'
  mariadb:
    driver: local
    driver_opts:
      type: 'none'
      o: bind
      device: '/home/hadubois/data/mariadb'
networks:
  inception:
    driver: bridge
